name: Bug report
description: Report a reproducible JARVIS defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python version"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs/screenshots (remove secrets)
